<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111812">
  <title>Portfólio - Lucas Vasconcelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="topbar-brand">
        <span class="brand-dot"></span>
        <span id="topbar-nick" class="topbar-nick"></span>
      </div>
      <span class="topbar-badge">Portfólio 2026</span>
    </div>
  </header>

  <main class="container main-content">
    <section class="profile-header">
      <div class="avatar-column">
        <div class="avatar-ring">
          <img
            id="perfil-foto"
            src="foto portofolio.jpeg"
            alt="Foto de perfil"
          >
        </div>
      </div>

      <div class="profile-info">
        <div class="profile-top-row">
          <h1 id="perfil-nickname" class="profile-nickname"></h1>
          <div class="social-actions">
            <a id="link-github" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-military">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11.03 11.03 0 0 1 5.8 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.66.79.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
              </svg>
              <span>GitHub</span>
            </a>
            <a id="link-linkedin" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-brown">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M4.98 3.5a2.48 2.48 0 1 1 0 4.96 2.48 2.48 0 0 1 0-4.96ZM3 9h3.96v12H3V9Zm7.24 0h3.8v1.64h.05c.53-1 1.82-2.06 3.75-2.06 4.01 0 4.75 2.64 4.75 6.07V21h-3.96v-5.63c0-1.34-.03-3.07-1.87-3.07-1.88 0-2.16 1.46-2.16 2.97V21h-3.96V9Z"/>
              </svg>
              <span>LinkedIn</span>
            </a>
          </div>
        </div>

        <ul class="profile-stats">
          <li><strong id="stat-materias">0</strong> <span>matérias</span></li>
          <li><strong id="stat-semanas">0</strong> <span>semanas</span></li>
          <li><strong id="stat-anexos">0</strong> <span>arquivos/links</span></li>
        </ul>

        <div class="profile-bio">
          <h2 id="perfil-nome" class="profile-name"></h2>
          <p id="perfil-tag" class="profile-tag"></p>
          <p id="perfil-sinopse" class="profile-synopsis"></p>
        </div>
      </div>
    </section>

    <nav class="highlights-section" id="highlights-section" aria-label="Filtrar por matéria">
      <div id="highlights-list" class="highlights-list"></div>
    </nav>

    <section class="feed-section">
      <div class="feed-header">
        <div>
          <h2 id="feed-titulo" class="feed-title">Todas as Matérias</h2>
          <p id="feed-subtitulo" class="feed-subtitle"></p>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="search"
            id="busca-input"
            placeholder="Buscar semana ou atividade..."
            aria-label="Buscar semana ou atividade"
            enterkeyhint="search"
            autocomplete="off"
          >
          <button type="button" id="busca-limpar" class="search-clear" aria-label="Limpar busca" hidden>×</button>
        </div>
      </div>

      <div id="semanas-grid" class="weeks-grid"></div>
    </section>
  </main>

  <div id="modal-senha" class="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <div class="modal-header">
        <div class="week-badges">
          <span id="modal-materia" class="badge-materia"></span>
          <span class="badge-semana">Acesso protegido</span>
        </div>
        <button type="button" id="modal-fechar" class="modal-close" aria-label="Fechar">×</button>
      </div>
      <h3 id="modal-titulo" class="modal-title">Digite a senha</h3>
      <p id="modal-desc" class="modal-desc">Informe a senha secreta para abrir o registro extra.</p>
      <form id="modal-form" class="modal-form">
        <input
          type="text"
          id="modal-input"
          class="modal-input"
          placeholder="Digite a senha..."
          autocomplete="off"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="go"
          required
        >
        <p id="modal-erro" class="modal-erro" role="alert" aria-live="polite" hidden>Senha incorreta. Tente novamente.</p>
        <div class="modal-actions">
          <button type="button" id="modal-cancelar" class="btn btn-outline">Cancelar</button>
          <button type="submit" class="btn btn-brown">Acessar carta →</button>
        </div>
      </form>
    </div>
  </div>

  <button type="button" id="btn-topo" class="scroll-top-btn" aria-label="Voltar ao topo" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="18 15 12 9 6 15" />
    </svg>
  </button>

  <footer class="footer">
    <div class="container footer-inner">
      <p id="footer-texto">Lucas Vasconcelos Alves • 3º B DS</p>
    </div>
  </footer>

  <script src="dados.js"></script>
  <script src="app.js"></script>
</body>
</html>
